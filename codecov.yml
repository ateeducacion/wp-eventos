# Codecov: el porcentaje y su variación, en un comentario de cada PR.
#
# **El suelo es el 90 %, en los dos ejes**: el del proyecto y el del parche.
# Arrancó en el 10 % a propósito, porque en un repositorio vacío las primeras
# entregas son andamiaje que se prueba con pocos tests grandes y un listón alto
# solo enseña a escribir tests de adorno para pasar al guardia. Ya no es ese
# repositorio: el aplicativo tiene sus pantallas, su formulario de inscripción y
# su aforo, la cobertura se ha estabilizado por encima del 90 % y el listón sube
# —ADR-0011, adenda del 2026-09-15—.
#
# Lo que eso significa en un PR: lo que se toca va con sus tests (el parche), y
# no se puede compensar tocando poco (el proyecto). Un PR que baje el total
# tumba, no avisa.
# Recetas de docs.codecov.com/docs/common-recipe-list.
comment:
  layout: "diff, flags, files"
  behavior: default
  require_changes: false
  require_base: false
  require_head: true
  hide_project_coverage: false

# `App::boot()` corre en el arranque, antes de que PHPUnit empiece a medir, y
# es idempotente: ningún test puede volver a ejecutar su cuerpo. Medirlo solo
# añade ruido. Lo que hace sí está probado, en `test-load-order.php`:
# que el arranque dejó enganchado lo que sostiene el aplicativo.
ignore:
  - "src/Evt/App.php"

coverage:
  status:
    project:
      default:
        target: 90%
        # Un punto de holgura: sin esto, una línea de más en un fichero que ya
        # estaba cubierto puede mover el total lo justo para tumbar un PR que no
        # ha empeorado nada.
        threshold: 1%
        informational: false
    patch:
      default:
        target: 90%
        informational: false
